<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./build/tailwind.css"/>
    <title>Document</title>
</head>
<body>
    <div class="bg-slate-800">
        <!----appbar--->
        <div class="bg-slate-700 p-5 h-12 flex justify-center items-center gap-x-4">
            <h1 class="text-slate-300 font-bold text-xl">Inventory App using js & tailwind</h1>
            <span class="flex items-center justify-center w-7 h-7 rounded-full bg-slate-500 border-2 border-slate-300 text-slate-300 font-bold">7</span>
        </div>
         <!----app content--->
        <div class="container max-screen-sm mx-auto">
             <!----app category--->
             <h2 class="text-xl text-slate-300 font-bold my-4"> Add New Category</h2>
             <form class="bg-slate-700 flex flex-col gap-y-4 p-4 ronded-xl mb-4">
                <div>
                    <label for="category-title" class="block mb-1 text-slate-300">Title</label>
                    <input type="text" id="category-title" name="category-title" class="bg-transparent text-slate-300 rounded-xl border border-slate-500 "/>
                </div>
                <div>
                    <label for="category-description" class="block mb-1 text-slate-300">Description</label>
                    <input type="text" id="category-description" name="category-description" class="bg-transparent text-slate-300 rounded-xl border border-slate-500 w-full"/>
                </div>
                <div class="flex items-center justify-between gap-x-4">
                    <button class="flex-1 border border-slate-400 text-slate-200 rounded-xl py-2">cancel</button>
                    <button class="flex-1 bg-slate-500 border border-slate-400 text-slate-200 rounded-xl py-2">Add New Category</button>
                </div>
             </form>

             <!--app product-->
             <h2 class="text-xl text-slate-300 font-bold mb-4"> Add New Product</h2>
             <form class="mb-4 bg-slate-700 flex flex-col gap-y-4 p-4 ronded-xl ">
                <div>
                    <label for="product-title" class="block mb-1 text-slate-300">Product Title</label>
                    <input type="text" id="product-title" name="product-title" class="bg-transparent text-slate-300 rounded-xl border border-slate-500 "/>
                </div>
                <div>
                    <label for="quantity" class="block mb-1 text-slate-300">Quantity</label>
                    <input type="number" id="quantity" name="quantity" class="bg-transparent text-slate-300 rounded-xl border border-slate-500 w-full"/>
                </div>
                <div>
                    <label for="category-product" class="block mb-1 text-slate-300">Category</label>
                    <select name="category-product" id="category-product" class="bg-transparent text-slate-300 rounded-xl border border-slate-500 w-full" >
                        <option class="bg-slate-500 text-slate-300" value="">select a category</option>
                        <option class="bg-slate-500 text-slate-300" value="frontend">frontend</option>
                        <option class="bg-slate-500 text-slate-300" value="backend">backend</option>
                    </select>  
                </div>
                <div class="flex items-center justify-between gap-x-4">
                    <button class="flex-1 bg-slate-500 border border-slate-400 text-slate-200 rounded-xl py-2">Add New Category</button>
                </div>
             </form>

             <!--product list-->
             <h2 class="text-xl text-slate-300 font-bold mb-4"> Product List</h2>
             <div class="flex item-center justify-between">
                <span class="text-slate-300">React</span>
                <div class="flex gap-x-4 items-center">
                    <span class="text-slate-400">date</span>
                    <span class="block px-3 py-0 text-slate-300 border border-slate-300 text-sm rounded-2xl">frontend</span>
                    <span class="flex items-center justify-center w-7 y-7 text-slate-300 border-2 border-slate-300 text-sm rounded-full bg-slate-500">7</span>
                    <button class="px-3 py-0.5 text-red-300 border border-red-300 text-sm rounded-2xl">delete</button>
                </div>
             </div>
        </div>
    </div>
</body>
</html>
